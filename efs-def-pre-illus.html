<html lang="en">
<head>

<title>EFS — DEF Pre-Illustration Modeler</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

:root {
  --navy:       #0d1b2e;
  --navy-2:     #152640;
  --navy-3:     #1e3558;
  --gold:       #c9a84c;
  --gold-lt:    #dfc278;
  --gold-pale:  #f7f0e0;
  --white:      #ffffff;
  --off:        #f5f3ee;
  --border:     #ddd8ce;
  --muted:      #8a8070;
  --green:      #2a6e45;
  --green-lt:   #e6f2ec;
  --red:        #8b2020;
  --red-lt:     #fdf0f0;
  --text:       #1a1a2a;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--off);color:var(--text);min-height:100vh}

/* ── HEADER ── */
.hdr{background:var(--navy);padding:18px 48px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(201,168,76,.2)}
.logo-box{width:42px;height:42px;background:var(--gold);border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:16px;color:var(--navy);letter-spacing:.5px}
.logo-text{font-family:'Playfair Display',serif;color:var(--white)}
.logo-text .t{font-size:20px;font-weight:600;letter-spacing:3px}
.logo-text .b{font-size:10px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-top:1px}
.hdr-right{margin-left:auto;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35)}
.sofr-live{display:flex;align-items:center;gap:8px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.25);border-radius:3px;padding:5px 12px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold)}
.sofr-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── LAYOUT ── */
.page{max-width:1100px;margin:0 auto;padding:40px 32px}
.two-col{display:grid;grid-template-columns:380px 1fr;gap:28px;align-items:start}

/* ── CARD ── */
.card{background:var(--white);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.card-hdr{background:var(--navy-2);padding:14px 22px;display:flex;align-items:center;gap:10px}
.card-hdr h2{font-family:'Playfair Display',serif;font-size:16px;color:var(--white);font-weight:500}
.card-hdr .step{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.3);padding:2px 8px;border-radius:2px}
.card-body{padding:24px 22px}

/* ── FORM ── */
.field-group{margin-bottom:20px}
.field-group:last-child{margin-bottom:0}
.field-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.field input,.field select{width:100%;background:var(--off);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:9px 12px;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus{border-color:var(--gold);background:rgba(201,168,76,.04)}
.field select option{background:white}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sep{height:1px;background:var(--border);margin:20px 0}
.section-tag{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;padding-bottom:6px;border-bottom:1px solid rgba(201,168,76,.2)}

/* SOFR path controls */
.rate-env-btns{display:flex;gap:8px;margin-top:8px}
.rate-btn{flex:1;padding:7px;border:1px solid var(--border);border-radius:3px;background:var(--off);font-family:'IBM Plex Sans',sans-serif;font-size:11px;cursor:pointer;transition:all .15s;color:var(--muted);text-align:center}
.rate-btn.active{background:var(--navy);color:var(--gold);border-color:var(--navy)}

.calc-btn{width:100%;background:var(--gold);color:var(--navy);border:none;border-radius:3px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:13px;cursor:pointer;margin-top:6px;transition:all .2s}
.calc-btn:hover{background:var(--gold-lt)}
.calc-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── OUTPUT PANEL ── */
.output-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;color:var(--muted);font-size:13px;gap:12px;border:1.5px dashed var(--border);border-radius:6px;background:rgba(255,255,255,.5)}
.output-placeholder .icon{font-size:36px;opacity:.3}

/* Key outputs */
.key-outputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px}
.ko-card{background:var(--navy);border-radius:5px;padding:16px 18px}
.ko-card.highlight{background:var(--navy-3);border:1px solid rgba(201,168,76,.3)}
.ko-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:6px}
.ko-value{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);font-weight:500;line-height:1}
.ko-sub{font-size:10px;color:rgba(255,255,255,.3);margin-top:4px}

/* Carrier instructions */
.carrier-box{background:var(--gold-pale);border:1px solid rgba(201,168,76,.3);border-radius:5px;padding:18px 20px;margin-bottom:20px}
.carrier-box h4{font-family:'Playfair Display',serif;font-size:14px;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.carrier-box h4 .tag{font-size:9px;background:var(--navy);color:var(--gold);padding:2px 8px;border-radius:2px;letter-spacing:1px;font-family:'IBM Plex Sans',sans-serif;font-weight:600}
.instr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.instr-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(201,168,76,.15);font-size:12px}
.instr-item:last-child{border-bottom:none}
.instr-key{color:var(--muted)}
.instr-val{font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--navy)}
.instr-val.highlight{color:var(--green);font-weight:600}

/* Premium schedule table */
table.sched{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
table.sched thead th{background:var(--navy);color:rgba(255,255,255,.65);font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:8px 10px;text-align:right;border-right:1px solid rgba(255,255,255,.08)}
table.sched thead th:first-child,table.sched thead th:nth-child(2){text-align:center}
table.sched tbody td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--border);border-right:1px solid #eee}
table.sched tbody td:first-child,table.sched tbody td:nth-child(2){text-align:center;font-weight:500}
table.sched tbody tr:nth-child(even){background:var(--off)}
table.sched tbody tr:hover{background:rgba(201,168,76,.05)}
table.sched tbody tr.phase-lender{background:rgba(42,110,69,.04)}
table.sched tbody tr.phase-maint{background:rgba(13,27,46,.03)}
table.sched tbody tr.payoff-yr{background:rgba(201,168,76,.12)!important;font-weight:600}
table.sched tfoot td{padding:8px 10px;text-align:right;border-top:2px solid var(--navy);font-weight:600;font-size:12px;background:var(--off)}
table.sched tfoot td:first-child,table.sched tfoot td:nth-child(2){text-align:center}

/* Phase legend */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.leg-dot{width:10px;height:10px;border-radius:2px}

/* Rate path mini chart */
.rate-path{display:flex;align-items:flex-end;gap:2px;height:40px;margin-top:10px}
.rate-bar{flex:1;background:rgba(201,168,76,.4);border-radius:1px 1px 0 0;transition:height .3s;position:relative}
.rate-bar.payoff-yr{background:rgba(42,110,69,.5)}
.rate-path-label{font-size:9px;color:var(--muted);text-align:center;margin-top:4px}

/* SOFR fetch status */
.sofr-status{font-size:11px;color:var(--muted);font-style:italic;margin-top:6px}
.sofr-status.loaded{color:var(--green)}
.sofr-status.error{color:var(--red)}

/* Disclaimer */
.disc{font-size:9px;color:var(--muted);line-height:1.6;border-top:1px solid var(--border);padding-top:16px;margin-top:20px}

/* Print */
@media print{
  .hdr,.calc-btn,.rate-env-btns{display:none!important}
  .two-col{grid-template-columns:1fr!important}
  .card-body{padding:16px}
}

.animate-in{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

<script>
// ── LEDGER FILE HANDLING ──
let lFiles = { lcsv1: null, lcsv2: null, lcsv3: null };

function lFileChosen(inputId, zoneId, nameId) {
  const f = document.getElementById(inputId).files[0];
  if (!f) return;
  lFiles[inputId] = f;
  document.getElementById(zoneId).classList.add('has-file');
  document.getElementById(nameId).textContent = f.name;
}
function lDragOver(e, z) { e.preventDefault(); document.getElementById(z).classList.add('has-file'); }
function lDragLeave(z) { if (!lFiles[z.replace('lzone','lcsv')]) document.getElementById(z).classList.remove('has-file'); }
function lDrop(e, inputId, zoneId) {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (!f || !f.name.endsWith('.csv')) return;
  lFiles[inputId] = f;
  document.getElementById(zoneId).classList.add('has-file');
  document.getElementById(inputId.replace('lcsv','lname')).textContent = f.name;
}

// Update rate display on upload zones
document.addEventListener('input', function(e) {
  if (e.target.id === 'l-rate1') document.getElementById('l-rate1-display').textContent = e.target.value || '6.75%';
  if (e.target.id === 'l-rate2') document.getElementById('l-rate2-display').textContent = e.target.value || '6.50%';
});

// ── NAVIGATION ──
function backToCalc() {
  document.getElementById('ledger-panel').style.display = 'none';
  document.getElementById('intake-panel').style.display = 'flex';
  window.scrollTo(0, 0);
}

function backToUpload() {
  document.getElementById('ledger-output-content').style.display = 'none';
  document.getElementById('ledger-upload-step').style.display = 'block';
}

// ── CSV PARSER ──
function parseCarrierCSV(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  const headerIdx = lines.findIndex(l =>
    l.toLowerCase().includes('policy year') || l.toLowerCase().includes('year') && l.toLowerCase().includes('age')
  );
  if (headerIdx < 0) return null;

  const rows = [];
  for (let i = headerIdx + 1; i < lines.length; i++) {
    const parts = lines[i].split(',').map(v => v.replace(/["\s]/g, ''));
    if (parts.length < 6) continue;
    const yr = parseInt(parts[0]);
    if (isNaN(yr) || yr < 1) continue;
    rows.push({
      year: yr,
      age: parseInt(parts[1]) || 0,
      premium: parseFloat(parts[2]) || 0,
      loan: parseFloat(parts[3]) || 0,
      annualIncome: parseFloat(parts[4]) || 0,
      accumValue: parseFloat(parts[5]) || 0,
      grossCSV: parseFloat(parts[6]) || 0,
      grossDB: parseFloat(parts[7]) || 0,
    });
  }
  return rows.length > 0 ? rows : null;
}

// ── INVESTMENT ACCOUNT (solved to zero, 15% cap gains on withdrawals) ──
function calcInvAccount(annualContrib, payYears, netRate, issueAge, incomeStartAge, incomeEndAge, defRows, capGainsRate) {
  const issueYear = new Date().getFullYear();
  const incomeYears = incomeEndAge - incomeStartAge + 1;

  // Accumulation: build balance up through age BEFORE income starts
  // balAtIncomeStart = EOY balance at (incomeStartAge - 1), i.e. the PV going into the annuity
  let balance = 0;
  for (const row of defRows) {
    if (row.age >= incomeStartAge) break; // stop BEFORE income start age
    const contrib = row.year <= payYears ? annualContrib : 0;
    const calYr = issueYear + row.year - 1;
    const isLeap = (calYr % 4 === 0 && calYr % 100 !== 0) || calYr % 400 === 0;
    balance = (balance + contrib) * (1 + netRate * (isLeap ? 366/365 : 1));
  }

  const balAtIncomeStart = balance; // EOY of year before income starts = PV for annuity

  // Solve: level gross withdrawal W that depletes account over incomeYears
  // Each period: balance grows at netRate, then W is withdrawn
  // Standard end-of-period annuity: W = PV * r / (1 - (1+r)^-n)
  const r = netRate;
  const n = incomeYears;
  const grossWithdrawal = r === 0
    ? balAtIncomeStart / n
    : balAtIncomeStart * r / (1 - Math.pow(1 + r, -n));
  const annualNetWithdrawal = grossWithdrawal * (1 - capGainsRate);

  // Build full year-by-year rows
  const invRows = [];
  let runBal = 0;
  for (const row of defRows) {
    if (row.age > 100) break;
    const contrib = row.year <= payYears ? annualContrib : 0;
    const calYr = issueYear + row.year - 1;
    const isLeap = (calYr % 4 === 0 && calYr % 100 !== 0) || calYr % 400 === 0;
    const growthRate = netRate * (isLeap ? 366/365 : 1);

    if (row.age < incomeStartAge) {
      // Accumulation phase
      runBal = (runBal + contrib) * (1 + growthRate);
      invRows.push({ year: row.year, age: row.age, contrib, grossWithdrawal: 0, netWithdrawal: 0, balance: runBal });
    } else if (row.age <= incomeEndAge) {
      // Distribution phase: grow then withdraw
      const grown = runBal * (1 + growthRate);
      const gross = Math.min(grossWithdrawal, grown); // can't withdraw more than available
      const net = gross * (1 - capGainsRate);
      runBal = Math.max(0, grown - gross);
      invRows.push({ year: row.year, age: row.age, contrib: 0, grossWithdrawal: gross, netWithdrawal: net, balance: runBal });
    } else {
      // Post income — account at zero
      invRows.push({ year: row.year, age: row.age, contrib: 0, grossWithdrawal: 0, netWithdrawal: 0, balance: 0 });
    }
  }

  return { invRows, annualGrossWithdrawal: grossWithdrawal, annualNetWithdrawal };
}

// ── GENERATE LEDGER ──
async function generateLedger() {
  const errEl = document.getElementById('ledger-error');
  errEl.style.display = 'none';

  const d = window._defData;
  if (!d) return;

  const rate1Label = document.getElementById('l-rate1').value.trim() || '6.75%';
  const rate2Label = document.getElementById('l-rate2').value.trim() || '6.50%';
  const advisorName = document.getElementById('l-advisor').value.trim();
  const dateVal = document.getElementById('l-date').value;
  const dateStr = dateVal
    ? new Date(dateVal + 'T12:00:00').toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' })
    : new Date().toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });

  // Read editable fields — these values carried from Modeler
  const clientName = document.getElementById('l-client').value.trim() || (d?.clientName || 'Sample Client');
  const issueAge = parseInt(document.getElementById('l-age').value) || d?.issueAge || 40;
  const payYears = parseInt(document.getElementById('l-payyears').value) || d?.payYears || 5;
  const incomeStartAge = parseInt(document.getElementById('l-income-start').value);
  const incomeEndAge = parseInt(document.getElementById('l-income-end').value);
  const contribRaw = document.getElementById('l-contrib').value.replace(/,/g, '');
  const annualContrib = parseFloat(contribRaw) || d?.annualContrib || 50000;

  if (isNaN(incomeStartAge)) return showLedgerError('Income start age is required.');
  if (isNaN(incomeEndAge) || incomeEndAge > 100) return showLedgerError('Income end age is required (max 100).');
  if (!lFiles.lcsv1) return showLedgerError('Primary rate CSV is required.');
  if (!lFiles.lcsv2) return showLedgerError('Alternative rate CSV is required.');

  try {
    const [t1, t2] = await Promise.all([readLedgerFile(lFiles.lcsv1), readLedgerFile(lFiles.lcsv2)]);
    const rows1 = parseCarrierCSV(t1);
    const rows2 = parseCarrierCSV(t2);
    if (!rows1) return showLedgerError('Could not parse primary rate CSV. Confirm file format.');
    if (!rows2) return showLedgerError('Could not parse alternative rate CSV. Confirm file format.');

    let rowsLIRP = null;
    if (lFiles.lcsv3) {
      const t3 = await readLedgerFile(lFiles.lcsv3);
      rowsLIRP = parseCarrierCSV(t3);
    }

    // Build loan lookup map
    const loanMap = {};
    if (d) { for (const r of d.rows) { loanMap[r.yr] = r; } }

    const payoffYear = d?.payoffYear || 0;
    const netRate = parseFloat(rate1Label) / 100 || 0.0675;
    const CAP_GAINS_RATE = 0.15;

    // Investment account calc with 15% cap gains on withdrawals
    const { invRows, annualGrossWithdrawal, annualNetWithdrawal } = calcInvAccount(
      annualContrib, payYears, netRate, issueAge,
      incomeStartAge, incomeEndAge, rows1, CAP_GAINS_RATE
    );

    const invMap = {};
    invRows.forEach(r => { invMap[r.year] = r; });
    const r2Map = {};
    rows2.forEach(r => { r2Map[r.year] = r; });
    const lirpMap = {};
    if (rowsLIRP) rowsLIRP.forEach(r => { lirpMap[r.year] = r; });

    renderLedger({
      d, rows1, r2Map, loanMap, invMap, lirpMap,
      annualGrossWithdrawal, annualNetWithdrawal, CAP_GAINS_RATE,
      rate1Label, rate2Label, advisorName, dateStr,
      clientName, issueAge, payYears, annualContrib,
      incomeStartAge, incomeEndAge, payoffYear,
      hasLIRP: rowsLIRP !== null
    });

  } catch(e) {
    showLedgerError('Error processing files: ' + e.message);
  }
}

function readLedgerFile(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = () => rej(new Error('File read failed'));
    r.readAsText(f);
  });
}

function showLedgerError(msg) {
  const el = document.getElementById('ledger-error');
  el.textContent = msg;
  el.style.display = 'block';
}

// ── RENDER LEDGER ──
function renderLedger({ d, rows1, r2Map, loanMap, invMap, lirpMap,
    annualGrossWithdrawal, annualNetWithdrawal, CAP_GAINS_RATE,
    rate1Label, rate2Label, advisorName, dateStr,
    clientName, issueAge, payYears, annualContrib, incomeStartAge, incomeEndAge,
    payoffYear, hasLIRP }) {

  const totalClientOutlay = payYears * annualContrib;

  // Identify payoff row — large one-time loan equal to bank payoff, NOT recurring income
  // In CSV: payoff year has annualIncome = loan = large amount matching payoffYear
  const isPayoffRow = (row) => row.year === payoffYear;

  // Recurring annual income = annualIncome in rows AFTER the payoff year
  const recurringRows1 = rows1.filter(r => r.annualIncome > 0 && r.age <= 100 && !isPayoffRow(r));
  const recurringRows2 = rows1.filter(r => r.age <= 100 && !isPayoffRow(r) && (r2Map[r.year]?.annualIncome || 0) > 0);

  const annualIncome1 = recurringRows1[0]?.annualIncome || 0;
  const annualIncome2 = r2Map[recurringRows2[0]?.year]?.annualIncome || 0;
  const totalIncome1 = recurringRows1.reduce((s, r) => s + r.annualIncome, 0);
  const totalIncome2 = recurringRows2.reduce((s, r) => s + (r2Map[r.year]?.annualIncome || 0), 0);

  const lirpAnnualIncome = Object.values(lirpMap).find(r => r.annualIncome > 0)?.annualIncome || 0;
  const totalLirpIncome = Object.values(lirpMap).filter(r => r.age <= 100).reduce((s, r) => s + (r.annualIncome || 0), 0);

  // Cumulative net income comparisons
  const totalInvNet = Object.values(invMap).reduce((s, r) => s + (r.netWithdrawal || 0), 0);
  const cumulativeAdvantage = totalIncome1 - totalInvNet;

  let tbody1 = '';
  let totClientOutlay = 0, totLenderPrem = 0, totPrem = 0, totIncome1 = 0, totIncome2 = 0;

  for (const row of rows1.filter(r => r.age <= 100)) {
    const ln = loanMap[row.year] || {};
    const r2 = r2Map[row.year] || {};
    const isPayoff = isPayoffRow(row);
    const isIncome = row.annualIncome > 0 && !isPayoff;
    const r2Income = (r2.annualIncome || 0) > 0 && !isPayoff;
    const loanBal = ln.cumBalance || 0;
    const postPayoff = row.year > payoffYear;

    const netCSV1 = postPayoff ? row.grossCSV : Math.max(0, row.grossCSV - loanBal);
    const netDB1  = postPayoff ? row.grossDB  : Math.max(0, row.grossDB  - loanBal);
    const netCSV2 = postPayoff ? (r2.grossCSV||0) : Math.max(0, (r2.grossCSV||0) - loanBal);
    const netDB2  = postPayoff ? (r2.grossDB||0)  : Math.max(0, (r2.grossDB||0)  - loanBal);

    const trClass = isPayoff ? 'payoff-yr' : isIncome ? 'income-yr' : '';

    totClientOutlay += ln.clientOutlay || 0;
    totLenderPrem   += ln.lenderThisYr || 0;
    totPrem         += ln.totalPrem    || 0;
    if (isIncome)  totIncome1 += row.annualIncome;
    if (r2Income)  totIncome2 += r2.annualIncome || 0;

    tbody1 += `<tr class="${trClass}">
      <td>${row.year}</td><td>${row.age}</td>
      <td>${ln.clientOutlay > 0 ? $f(ln.clientOutlay) : '—'}</td>
      <td>${ln.equityPrem > 0 ? $f(ln.equityPrem) : '—'}</td>
      <td>${ln.lenderThisYr > 0 ? $f(ln.lenderThisYr) : '—'}</td>
      <td>${ln.totalPrem > 0 ? $f(ln.totalPrem) : '—'}</td>
      <td>${ln.interestAccrued > 0 ? $f(ln.interestAccrued) : '—'}</td>
      <td>${ln.cumBalance > 0 ? $f(ln.cumBalance) : '—'}</td>
      <td>${isPayoff ? `<strong style="color:var(--green)">${$f(ln.loanPayoff)}</strong>` : '—'}</td>
      <td class="sec-div ${isIncome?'income-val':''}">${isIncome ? $f(row.annualIncome) : '—'}</td>
      <td>${$f(row.accumValue)}</td><td>${$f(row.grossCSV)}</td>
      <td>${$f(netCSV1)}</td><td>${$f(netDB1)}</td>
      <td class="sec-div ${r2Income?'income-val':''}">${r2Income ? $f(r2.annualIncome) : '—'}</td>
      <td>${$f(r2.accumValue)}</td><td>${$f(r2.grossCSV)}</td>
      <td>${$f(netCSV2)}</td><td>${$f(netDB2)}</td>
    </tr>`;
  }

  // ── Page 2: combined LIRP + Investment Account ──
  let tbodyCombined = '', totLirpIncomeTbl = 0, totGross = 0, totNet = 0;
  const invRowsArr = Object.values(invMap).filter(r => r.age <= 100);

  for (const row of rows1.filter(r => r.age <= 100)) {
    const lr = lirpMap[row.year] || {};
    const inv = invMap[row.year] || {};
    const lirpIncome = (lr.annualIncome || 0) > 0;
    const invIncome = (inv.grossWithdrawal || 0) > 0;
    totLirpIncomeTbl += lr.annualIncome || 0;
    totGross += inv.grossWithdrawal || 0;
    totNet   += inv.netWithdrawal  || 0;

    // Shared contribution column: show client contribution (same for both)
    const sharedContrib = row.year <= payYears ? annualContrib : 0;

    tbodyCombined += `<tr class="${lirpIncome || invIncome ? 'income-yr' : ''}">
      <td>${row.year}</td><td>${row.age}</td>
      <td>${sharedContrib > 0 ? $f(sharedContrib) : '—'}</td>
      <td class="sec-div ${lirpIncome?'income-val':''}">${lirpIncome ? $f(lr.annualIncome) : '—'}</td>
      <td>${$f(lr.accumValue)}</td>
      <td>${$f(lr.grossCSV)}</td>
      <td>${$f(lr.grossDB)}</td>
      <td class="sec-div ${invIncome?'income-val':''}">${invIncome ? $f(inv.grossWithdrawal) : '—'}</td>
      <td class="${invIncome?'income-val':''}">${invIncome ? $f(inv.netWithdrawal) : '—'}</td>
      <td>${inv.balance > 100 ? $f(inv.balance) : inv.age >= incomeStartAge ? '<strong style="color:var(--muted)">$0</strong>' : '—'}</td>
    </tr>`;
  }

  const html = `
    <div class="ledger-banner">
      <div class="banner-client">
        
        
        <div class="name">${clientName}</div>
        <div style="font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);font-weight:600;letter-spacing:1px;margin-top:3px">Deferred Enhanced Funding</div>
        <div style="font-family:'Playfair Display',serif;font-size:13px;color:rgba(255,255,255,.5);font-weight:400;letter-spacing:1px;margin-top:2px">Enhanced Roth Alternative</div>
        <div class="meta" style="margin-top:3px">${payYears}-Pay · Age ${issueAge} · Income Ages ${incomeStartAge}–${incomeEndAge} · ${dateStr}${advisorName ? ' · ' + advisorName : ''}</div>
      </div>
      <div class="banner-stats">
        <div class="bstat"><div class="bl">Total Client Investment</div><div class="bv">${$f(totalClientOutlay)}</div></div>
        <div class="bstat"><div class="bl">Total Income @ ${rate1Label}% Gross</div><div class="bv">${$f(totalIncome1)}</div></div>
        <div class="bstat"><div class="bl">Total Income @ ${rate2Label}% Gross</div><div class="bv">${$f(totalIncome2)}</div></div>
        <div class="bstat"><div class="bl">Income Ages</div><div class="bv">${incomeStartAge}–${incomeEndAge}</div></div>
      </div>
    </div>

    <div class="ledger-tbl-wrap">
      <table class="ldg">
        <thead>
          <tr>
            <th rowspan="2" style="vertical-align:bottom">Yr</th>
            <th rowspan="2" style="vertical-align:bottom">Age</th>
            <th colspan="7" class="tbl-section-hdr">INVESTED CAPITAL</th>
            <th colspan="5" class="tbl-section-hdr sec-div">DEFERRED ENHANCED FUNDING · ${rate1Label}% GROSS RETURN</th>
            <th colspan="5" class="tbl-section-hdr sec-div">DEFERRED ENHANCED FUNDING · ${rate2Label}% GROSS RETURN</th>
          </tr>
          <tr>
            <th>Client Outlay</th><th>Equity Prem</th><th>Lender Prem</th>
            <th>Total Prem</th><th>Interest Accrued</th><th>Cum Loan Bal</th><th>Loan Payoff</th>
            <th class="sec-div">Annual Income</th><th>Accum Value</th><th>Gross CSV</th><th>Net CSV</th><th>Net DB</th>
            <th class="sec-div">Annual Income</th><th>Accum Value</th><th>Gross CSV</th><th>Net CSV</th><th>Net DB</th>
          </tr>
        </thead>
        <tbody>${tbody1}</tbody>
      </table>
    </div>

    <div class="comp-strip" style="grid-template-columns:1fr 1fr 1fr;">
      <div class="comp-crd hl">
        <div class="ct" style="font-size:10px;letter-spacing:1.5px">DEFERRED ENHANCED FUNDING · ${rate1Label}% GROSS RETURN</div>
        <div class="cv">Primary Rate Scenario</div>
        <div class="cstat"><span class="ck">Income Ages</span><span class="cv2">${incomeStartAge}–${incomeEndAge}</span></div>
        <div class="cstat"><span class="ck">Total Lifetime Income</span><span class="cv2 g">${$f(totIncome1)}</span></div>
        <div class="cstat"><span class="ck">Total Client Investment</span><span class="cv2">${$f(totalClientOutlay)}</span></div>
      </div>
      <div class="comp-crd">
        <div class="ct" style="font-size:10px;letter-spacing:1.5px">DEFERRED ENHANCED FUNDING · ${rate2Label}% GROSS RETURN</div>
        <div class="cv">Alternative Rate Scenario</div>
        <div class="cstat"><span class="ck">Income Ages</span><span class="cv2">${incomeStartAge}–${incomeEndAge}</span></div>
        <div class="cstat"><span class="ck">Total Lifetime Income</span><span class="cv2">${$f(totIncome2)}</span></div>
        <div class="cstat"><span class="ck">vs Primary Rate</span><span class="cv2">${$f(totIncome1-totIncome2)} less lifetime</span></div>
      </div>
      <div class="comp-crd">
        <div class="ct" style="font-size:10px;letter-spacing:1.5px">TAXABLE INVESTMENT ACCOUNT · ${rate1Label}% NET RETURN</div>
        <div class="cv">Taxable Comparison</div>
        <div class="cstat"><span class="ck">Total Lifetime Net Income</span><span class="cv2">${$f(totalInvNet)}</span></div>
        <div class="cstat"><span class="ck">DEF Total Lifetime Income</span><span class="cv2 g">${$f(totIncome1)}</span></div>
        <div class="cstat"><span class="ck">Cumulative Tax-Free Advantage</span><span class="cv2 g">${$f(cumulativeAdvantage)} more lifetime</span></div>
      </div>
    </div>

    <div class="ldg-disc" style="margin-top:0;border-top:1px solid var(--border)">
      <strong>EFS LIFE LLC — CONFIDENTIAL.</strong> This is a hypothetical model. Refer to the insurance carrier full illustration for life insurance policy details, charges, guarantees and guidelines. Loan balance projections based on 90-Day Avg SOFR plus spread, subject to a 4.00% effective rate floor. All life insurance rates shown are gross illustrated rates before policy charges. The investment account comparison assumes a ${rate1Label}% net return and a 15% capital gains tax rate on all distributions — a simplified assumption. Actual tax treatment varies by individual circumstances. All amounts are hypothetical and not guaranteed. The premium finance arrangement is offered by Enhanced Funding Solutions LLC. Confidential — EFS Life LLC · EFSLife.com${advisorName ? ' · ' + advisorName : ''} · ${dateStr}
    </div>

    <!-- PAGE 2 -->
    <div class="pg2-header" style="page-break-before:always">
      <h3>Roth Alternative & Taxable Investment Comparison · Same Contribution · Different Outcomes</h3>
    </div>

    ${hasLIRP ? `
    <div class="ledger-tbl-wrap">
      <table class="ldg">
        <thead>
          <tr>
            <th rowspan="2" style="vertical-align:bottom">Yr</th>
            <th rowspan="2" style="vertical-align:bottom">Age</th>
            <th rowspan="2" style="vertical-align:bottom">Client<br>Contribution</th>
            <th colspan="4" class="tbl-section-hdr sec-div">ROTH ALTERNATIVE — SELF-FUNDED LIRP · ${rate1Label}% GROSS RETURN</th>
            <th colspan="3" class="tbl-section-hdr sec-div">TAXABLE INVESTMENT ACCOUNT · ${rate1Label}% Net Return · 15% CG</th>
          </tr>
          <tr>
            <th class="sec-div">Annual Income</th><th>Accum Value</th><th>Gross CSV</th><th>Gross DB</th>
            <th class="sec-div">Gross Withdrawal</th><th>Net After 15% CG</th><th>EOY Balance</th>
          </tr>
        </thead>
        <tbody>${tbodyCombined}</tbody>
      </table>
    </div>
    <div class="comp-strip" style="grid-template-columns:1fr 1fr 1fr;margin-top:0">
      <div class="comp-crd">
        <div class="ct" style="font-size:10px;letter-spacing:1.5px">ROTH ALTERNATIVE — SELF-FUNDED LIRP · ${rate1Label}% GROSS RETURN</div>
        <div class="cv">Same Contribution. No Bank. No Leverage.</div>
        <div class="cstat"><span class="ck">Total Lifetime Income</span><span class="cv2">${$f(totalLirpIncome)}</span></div>
        <div class="cstat"><span class="ck">Income Ages</span><span class="cv2">${incomeStartAge}\u2013${incomeEndAge}</span></div>
        <div class="cstat"><span class="ck">Total Client Investment</span><span class="cv2">${$f(totalClientOutlay)}</span></div>
      </div>
      <div class="comp-crd">
        <div class="ct" style="font-size:10px;letter-spacing:1.5px">TAXABLE INVESTMENT ACCOUNT · ${rate1Label}% NET RETURN</div>
        <div class="cv">Same Contribution. Taxable.</div>
        <div class="cstat"><span class="ck">Total Lifetime Net Income</span><span class="cv2">${$f(totalInvNet)}</span></div>
        <div class="cstat"><span class="ck">Income Ages</span><span class="cv2">${incomeStartAge}\u2013${incomeEndAge}</span></div>
        <div class="cstat"><span class="ck">Total Client Investment</span><span class="cv2">${$f(totalClientOutlay)}</span></div>
      </div>
      <div class="comp-crd hl">
        <div class="ct" style="font-size:10px;letter-spacing:1.5px">SAME CONTRIBUTION · DIFFERENT OUTCOMES</div>
        <div class="cv">The Difference Leverage Makes</div>
        <div class="cstat"><span class="ck">DEF Total Lifetime Income</span><span class="cv2 g">${$f(totIncome1)}</span></div>
        <div class="cstat"><span class="ck">Advantage vs Self-Funded LIRP</span><span class="cv2 g">+${$f(totIncome1-totalLirpIncome)}</span></div>
        <div class="cstat"><span class="ck">Advantage vs Taxable Account</span><span class="cv2 g">+${$f(cumulativeAdvantage)}</span></div>
      </div>
    </div>
    ` : `
    <div class="ledger-tbl-wrap">
      <table class="ldg">
        <thead>
          <tr>
            <th>Yr</th><th>Age</th><th>Client Contribution</th>
            <th>Gross Withdrawal</th><th>Net After 15% CG</th><th>EOY Balance</th>
          </tr>
        </thead>
        <tbody>
          ${invRowsArr.map(r => `<tr class="${r.grossWithdrawal>0?'income-yr':''}">\n            <td>${r.year}</td><td>${r.age}</td>\n            <td>${r.contrib > 0 ? $f(r.contrib) : '\u2014'}</td>\n            <td class="${r.grossWithdrawal>0?'income-val':''}">${r.grossWithdrawal > 0 ? $f(r.grossWithdrawal) : '\u2014'}</td>\n            <td class="${r.netWithdrawal>0?'income-val':''}">${r.netWithdrawal > 0 ? $f(r.netWithdrawal) : '\u2014'}</td>\n            <td>${r.balance > 100 ? $f(r.balance) : r.age >= incomeStartAge ? '<strong style="color:var(--muted)">$0</strong>' : '\u2014'}</td>\n          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    `}

    <div class="ldg-disc" style="display:flex;align-items:center;gap:14px;"><div style="flex:1">
      <strong>EFS LIFE LLC — CONFIDENTIAL.</strong> This is a hypothetical model. Refer to the insurance carrier full illustration for life insurance policy details, charges, guarantees and guidelines. Loan balance projections based on 90-Day Avg SOFR plus spread, subject to a 4.00% effective rate floor. All life insurance rates shown are gross illustrated rates before policy charges. The investment account comparison assumes a ${rate1Label}% net return and a 15% capital gains tax rate on all distributions — a simplified assumption. Actual tax treatment varies by individual circumstances. All amounts are hypothetical and not guaranteed. The premium finance arrangement is offered by Enhanced Funding Solutions LLC. Confidential — EFS Life LLC · EFSLife.com${advisorName ? ' · ' + advisorName : ''} · ${dateStr}
    </div></div>
  `;

  document.getElementById('ledger-rendered').innerHTML = html;
  document.getElementById('ledger-id-label').textContent =
    `${clientName} · DEF ${payYears}-Pay · ${rate1Label} Primary / ${rate2Label} Alternative`;
  document.getElementById('ledger-upload-step').style.display = 'none';
  document.getElementById('ledger-output-content').style.display = 'block';
  window.scrollTo(0, 0);

  // Store results globally for discussion doc
  window._ledgerResults = {
    clientName, issueAge, payYears, annualContrib, payoffYear,
    incomeStartAge, incomeEndAge, totalClientOutlay,
    rate1Label, rate2Label, advisorName, dateStr,
    defTotalIncome: totIncome1,
    defAnnualIncome: annualIncome1,
    defPayoff: d?.payoffAmount || 0,
    lirpTotalIncome: totalLirpIncome,
    lirpAnnualIncome,
    invTotalNet: totalInvNet,
    invAnnualNet: annualNetWithdrawal,
    hasLIRP
  };
}

// ── OPEN DISCUSSION DOC ──
function openDiscussionDoc() {
  const r = window._ledgerResults;
  if (!r) return alert('Generate the ledger first before opening the Discussion Doc.');
  localStorage.setItem('efs_ledger_data', JSON.stringify(r));
  window.open('efs-discussion-doc.html', '_blank');
}
